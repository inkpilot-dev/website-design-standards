[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inkport-engine"
version = "0.1.0"
description = "Inkport local training, verification and inference engine (sidecar for the desktop app)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "safetensors>=0.4.5",
  "tokenizers>=0.21",
  "huggingface_hub>=0.30",
  "jsonschema>=4.21",
  "pypdf>=5.0",
  "cryptography>=43",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Torch-based training and inference (CPU / CUDA / ROCm / XPU / MPS). The torch wheel variant is
# chosen by the bootstrapper's index URL (see src-tauri/src/runtime.rs), not by this extra.
torch = [
  "torch>=2.6",
  "transformers>=4.56",
  "peft>=0.15",
  "accelerate>=1.3",
]
# NVIDIA: 4-bit QLoRA, Unsloth kernels and TRL GRPO.
cuda = [
  "inkport-engine[torch]",
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
  "trl>=0.21",
  "datasets>=3.0",
]
unsloth = [
  "inkport-engine[cuda]",
  "unsloth>=2025.8.1; platform_system != 'Darwin'",
]
# Apple Silicon: MLX training and inference.
mlx = [
  "mlx>=0.26; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.26; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "transformers>=4.56",
]
# Optional GGUF inference through llama.cpp.
llamacpp = ["llama-cpp-python>=0.3.8"]
docx = ["python-docx>=1.1"]
cpu = ["inkport-engine[torch]"]
dev = [
  "inkport-engine[torch]",
  "pytest>=8",
  "trl>=0.21",
  "datasets>=3.0",
]

[project.scripts]
inkport-engine = "engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "engine/_contracts"

[tool.hatch.build.targets.sdist]
include = ["engine", "contracts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["slow: trains a tiny model end-to-end (about 1-3 minutes on CPU)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
