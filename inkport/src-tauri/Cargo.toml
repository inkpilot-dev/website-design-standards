[package]
name = "inkport"
version = "0.1.0"
description = "Inkport: train verifiable specialist models on your own computer"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
default-run = "inkport"

[lib]
name = "inkport_lib"
path = "src/lib.rs"

[[bin]]
name = "inkport"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inkport-cli"
path = "src/bin/inkport-cli.rs"

[features]
default = ["desktop"]
# The desktop shell (Tauri + WebView). Build the headless supervisor/CLI with --no-default-features.
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
sysinfo = "0.33"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
