# Builds the Inkport one-and-done installers (real Qwen3 1.7B starter included), proves each one
# works offline with scripts/clean_machine_check.*, opens the real window and uses it
# (scripts/window_check.*), and uploads the installers as downloadable artifacts.
name: Inkport installers

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        default: all
        options: [all, windows, macos, linux]
      long_checks:
        description: Run the long command-line training checks too (about 40 minutes more per platform)
        type: boolean
        default: true
  push:
    branches: [claude/busy-goodall-wyjcg6]
    paths: ["inkport/**", ".github/workflows/inkport-installers.yml"]

concurrency:
  group: inkport-installers-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: inkport

jobs:
  macos:
    name: macOS (Apple Silicon)
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      APPLE_SIGNING_IDENTITY: "-"   # ad-hoc signature; set a Developer ID secret for notarized builds
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: inkport/pnpm-lock.yaml }
      - name: Supervisor tests
        continue-on-error: true   # reported, but a platform-specific test must not hide whether the installer works
        working-directory: inkport/src-tauri
        run: cargo test --no-default-features
      - name: Build installer
        id: build
        run: scripts/build_all_in_one.sh
      - name: Open the app window (it must start, check itself and stay open)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          APP="$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)"
          export INKPORT_HOME="$RUNNER_TEMP/Inkport window é 日本語/Inkport"
          mkdir -p "$INKPORT_HOME" window-check
          "$APP/Contents/MacOS/inkport" > window-check/app.log 2>&1 &
          PID=$!
          # The window's own code asks for the start-up check and the hardware report; their files
          # appearing proves the page loaded, ran, and reached the engine.
          for i in $(seq 1 120); do
            [ -f "$INKPORT_HOME/state/bundle-verified.json" ] && [ -f "$INKPORT_HOME/hardware.json" ] && break
            kill -0 $PID 2>/dev/null || { echo "the app exited"; cat window-check/app.log; exit 1; }
            sleep 2
          done
          sleep 8
          screencapture -x window-check/macos-window.png || echo "no screenshot (screen recording is not permitted on this runner)"
          ls -la "$INKPORT_HOME" "$INKPORT_HOME/state" || true
          [ -f "$INKPORT_HOME/state/bundle-verified.json" ] || { echo "FAIL: the window never ran its start-up check"; cat window-check/app.log; kill $PID; exit 1; }
          [ -f "$INKPORT_HOME/hardware.json" ] || { echo "FAIL: the window never asked for the hardware report"; kill $PID; exit 1; }
          kill -0 $PID || { echo "FAIL: the app did not stay open"; cat window-check/app.log; exit 1; }
          echo "PASS the window opened, ran its start-up check from a folder with spaces and non-Latin characters, and stayed open"
          kill $PID; sleep 3
          ! pgrep -f "llama-server|python.* -m engine" || { echo "FAIL: helper processes left behind"; exit 1; }
          echo "PASS closing the app left no helper process behind"
      - name: Clean-machine check (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.long_checks) }}
        run: scripts/clean_machine_check.sh build/installers/macos-aarch64-mlx/*.dmg
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}   # a failed check turns the job red but keeps the download
        with:
          name: Inkport-macOS-AppleSilicon
          path: |
            inkport/build/installers/macos-aarch64-mlx/*.dmg
            inkport/build/installers/macos-aarch64-mlx/SHA256SUMS
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Inkport-macOS-window
          path: inkport/window-check/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows (x64)
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true
        working-directory: .
      - uses: actions/checkout@v4
      - name: Check the PowerShell scripts parse (fails in seconds instead of after the build)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $bad++; $errors | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $f.Name, $_.Extent.StartLineNumber, $_.Message) } } else { Write-Host "OK $($f.Name)" }
          }
          if ($bad) { exit 1 }
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: inkport/pnpm-lock.yaml }
      - name: Supervisor tests
        continue-on-error: true   # reported, but a platform-specific test must not hide whether the installer works
        working-directory: inkport/src-tauri
        run: cargo test --no-default-features
      - name: Vulkan SDK (build machine only; lets answers use any graphics card)
        continue-on-error: true   # without it the build falls back to processor-only answers
        shell: pwsh
        working-directory: .
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          curl.exe -fsSL --retry 3 -o $exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          if ($LASTEXITCODE -ne 0) { throw "could not download the Vulkan SDK" }
          $root = "C:\VulkanSDK\inkport"
          $p = Start-Process -FilePath $exe -ArgumentList @("--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(15 * 60 * 1000)) { $p.Kill(); throw "the Vulkan SDK installer did not finish" }
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "glslc.exe not found after installing the Vulkan SDK (exit code $($p.ExitCode))" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH
          & "$root\Bin\glslc.exe" --version
      - name: Build installer
        id: build
        shell: pwsh
        run: ./scripts/build_all_in_one.ps1 -VulkanOptional -Bundles nsis
      - name: Quick clean-machine check (offline install, integrity, practice exam, answers)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $files = @(Get-ChildItem build/installers/windows-x86_64-cpu/* -Include *.exe, *.zip)
          if ($files.Count -eq 0) { throw "no Windows installer was produced" }
          foreach ($f in $files) {
            Write-Host "`n### checking $($f.Name)"
            ./scripts/clean_machine_check.ps1 -Installer $f.FullName -Quick
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      # Uploaded as soon as the installer exists, so the download never waits for the long tests.
      - name: Upload the installer (.exe)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Inkport-Windows-x64-Installer
          path: |
            inkport/build/installers/windows-x86_64-cpu/*.exe
            inkport/build/installers/windows-x86_64-cpu/SHA256SUMS
          compression-level: 0
          retention-days: 30
      - name: Upload the portable zip (no installer)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Inkport-Windows-x64-Portable
          path: inkport/build/installers/windows-x86_64-cpu/*.zip
          compression-level: 0
          retention-days: 30
      - name: Window check (the real window - project, exam, training, verdict, local API, chat, restart)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 120
        run: |
          $f = Get-ChildItem build/installers/windows-x86_64-cpu/*.exe | Select-Object -First 1
          if (-not $f) { throw "there is no .exe installer to open" }
          ./scripts/window_check.ps1 -Installer $f.FullName -Out window-check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload the window screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Inkport-Windows-window
          path: inkport/window-check/
          if-no-files-found: ignore
          retention-days: 14
      - name: Full clean-machine check (adds training + the hidden-test gate through the command line)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.long_checks) }}
        shell: pwsh
        timeout-minutes: 100
        run: |
          $f = @(Get-ChildItem build/installers/windows-x86_64-cpu/* -Include *.exe, *.zip) | Sort-Object { $_.Extension -ne ".exe" } | Select-Object -First 1
          Write-Host "### checking $($f.Name)"
          # A short run: this proves training, the gate and adapter serving work on Windows; it is not a quality benchmark.
          ./scripts/clean_machine_check.ps1 -Installer $f.FullName -TrainOverrides '{"sft":{"max_steps":12,"eval_every":12,"checkpoint_every":12},"stage2":{"mode":"none"},"gate":{"general_suite_n":8,"max_new_tokens":96,"max_general_drop_pts":100},"dev_eval_n":8}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The .exe installer must exist (the portable zip alone is not a complete release)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Get-ChildItem build/installers/windows-x86_64-cpu/*.exe -ErrorAction SilentlyContinue)) { throw "the NSIS installer was not produced; see the Build installer step" }

  linux:
    name: Linux (x64)
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - name: System packages (build and test machine only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libvulkan-dev zstd file xz-utils xvfb webkit2gtk-driver dbus
      - name: Vulkan SDK (glslc + headers, build machine only)
        working-directory: .
        run: |
          curl -fsSL -o vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
          mkdir -p "$HOME/vulkan" && tar -xf vulkan-sdk.tar.xz -C "$HOME/vulkan" --strip-components=1
          echo "VULKAN_SDK=$HOME/vulkan/x86_64" >> "$GITHUB_ENV"
          echo "$HOME/vulkan/x86_64/bin" >> "$GITHUB_PATH"
          "$HOME/vulkan/x86_64/bin/glslc" --version
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: inkport/pnpm-lock.yaml }
      - name: Unit tests - engine, supervisor, interface types (fail in minutes instead of after the build)
        run: |
          uv run --python 3.12 --extra dev pytest tests/python -q --ignore=tests/python/test_e2e_engine.py
          (cd src-tauri && cargo test --no-default-features)
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Interface flow tests (simulated engine - stop, crash, rejected run, too little data, reopen, ...)
        run: |
          npm install --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/pw" playwright@1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          (pnpm dev --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:1420/ && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/ui_flows_test.cjs ui-flows
          pkill -f "vite" || true
      - name: Build installers
        id: build
        run: scripts/build_all_in_one.sh
      - name: Window check (the real window from the AppImage - project, exam, start and stop a run)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: scripts/window_check.sh build/installers/linux-x86_64-cpu/*.AppImage window-check
      - name: Clean-machine check (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.long_checks) }}
        run: scripts/clean_machine_check.sh build/installers/linux-x86_64-cpu/*.AppImage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}   # a failed check turns the job red but keeps the download
        with:
          name: Inkport-Linux-x64
          path: |
            inkport/build/installers/linux-x86_64-cpu/*.AppImage
            inkport/build/installers/linux-x86_64-cpu/*.tar.zst
            inkport/build/installers/linux-x86_64-cpu/*.deb
            inkport/build/installers/linux-x86_64-cpu/SHA256SUMS
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Inkport-Linux-window
          path: |
            inkport/window-check/
            inkport/ui-flows/
          if-no-files-found: ignore
          retention-days: 14
